<!doctype html><html><head><meta charset=utf8><meta name="color-scheme" content="light dark"><script>document.documentElement.dataset.theme='dark'</script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>인사노무관리론 회독</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1c2028">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 고정 상단 도구줄 + 왼쪽 목차 열 + 오른쪽 원본 페이지 세로 스크롤. 패드·노트북 가로 기준, 좁으면 목차는 서랍 */
:root{
  --ink:#1d2430; --ink-2:#4a5466; --ink-3:#7c8596;
  --paper:#f3f4f6; --panel:#ffffff; --line:#d9dce3; --well:#e7e9ee;
  --accent:#9b1c2c; --accent-soft:#f6e3e5; --accent-ink:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --ng:#b3261e; --ng-soft:#fbe4e2; --warn:#b85c00; --warn-soft:#fff0dc;
  --band1:#4fb06c; --band2:#c3e9a6; --band3:#93d35a; --band4:#1f9d55;
  --cs-ink:#8a5a00; --cs-soft:#fbf3e2;
  --st-ink:#5b35b0; --st-line:#c9b6f2; --st-soft:#f1ebff;
  --kw:rgba(255,128,170,.42); --kw-cover:#ffc9da; --kw-edge:#f497b6; --kw-num:#a3355f;
  --shadow:0 6px 24px rgba(20,28,40,.14);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6e9ef; --ink-2:#b4bbc8; --ink-3:#8790a0; --paper:#14171d; --panel:#1c2028; --line:#2e3440; --well:#23272f;
  --accent:#e0606f; --accent-soft:#3a1f24; --accent-ink:#1a0d10; --ok:#5cc28d; --ok-soft:#173326; --ng:#ef7a70; --ng-soft:#3a1d1b; --warn:#f0a050; --warn-soft:#3a2a14;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6e9ef; --ink-2:#b4bbc8; --ink-3:#8790a0; --paper:#14171d; --panel:#1c2028; --line:#2e3440; --well:#23272f;
  --accent:#e0606f; --accent-soft:#3a1f24; --accent-ink:#1a0d10; --ok:#5cc28d; --ok-soft:#173326; --ng:#ef7a70; --ng-soft:#3a1d1b; --warn:#f0a050; --warn-soft:#3a2a14;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
[hidden]{display:none!important}
.scp{margin:14px 6px 2px;padding:4px 8px;font-size:14px;font-weight:700;background:var(--bg-2,rgba(127,127,127,.16));border-radius:6px}
.scg{margin:10px 6px 4px;border-left:3px solid #4fb06c;padding:2px 0 2px 8px}
.scg b{font-size:15px}.scg span{font-size:12px;color:var(--ink-3);margin-left:6px}
#side.sc #cur,#side.sc #legend{display:none!important}
#side.sc #tree{padding-top:2px}
.sci{margin:0 6px 0 17px;padding:5px 6px;border-left:1px solid var(--line);display:grid;gap:2px}
.sci .nm{font-weight:600;font-size:15px}.sci .th{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.sci .cv{font-size:13px!important;padding:1px 10px!important}
.sci .cv{background:var(--well);color:var(--ink-3);border-radius:4px;padding:1px 6px;cursor:pointer;font-size:12px;font-weight:400}
.sci .pp{display:flex;gap:4px;flex-wrap:wrap}
#sideOpen{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:30;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;box-shadow:var(--shadow);opacity:.9}
#penUndo{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:31;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;box-shadow:var(--shadow);opacity:.85;touch-action:manipulation}
#penUndo:active{background:var(--well)}
#stBtn,#cmBtn,#tabSt{display:none!important}

/* 두문자 탭 */
.dml{display:inline-flex;align-items:center;gap:4px;flex:none;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel);color:var(--ink);font:inherit}
.dml b{font-size:18px;min-width:1em;text-align:center;font-weight:700}.dml.big b{font-size:24px}
.dml.fixed{border-color:#0a74c8}
button.dml{cursor:pointer}
.cuetx{font-size:15px;font-weight:600;color:var(--ink)}
.cuepick{display:flex;flex-wrap:wrap;gap:4px}.cuepick .lab{width:100%;font-size:12px;color:var(--ink-3)}
.cuepick .chip.on{border-color:#0a74c8;color:#0a74c8}
.dmans{flex:1;min-width:0;display:grid;gap:4px}.dmans .adj,.dmxr .adj{display:flex;gap:4px}
.dmctl{display:grid;gap:6px;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dmctl .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.dmctl .k{font-size:12px;color:var(--ink-3);width:28px}
.dmctl .seg button{padding:4px 8px;font-size:12px}
.chip[aria-pressed="true"]{border-color:#0a74c8;color:#0a74c8}
.dmg1{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px;margin:14px 0 4px;padding:6px 6px;color:var(--ink);background:var(--well);border-radius:8px}
.dmg1 .tt{flex:1}.dmg1 .n{font-size:11px;color:var(--ink-3);font-weight:400}
.dmg1 input{width:18px;height:18px;flex:none}
.dmg2{display:flex;gap:6px;align-items:baseline;font-weight:400;font-size:11.5px;margin:10px 0 1px 6px;color:var(--ink-3)}
.dmg2 .n{margin-left:auto;font-size:11px;color:var(--ink-3)}
.dmg3{font-size:11.5px;color:var(--ink-3);margin:6px 0 1px 14px}
.dmit{display:flex;gap:8px;align-items:center;margin:3px 0 3px 12px;padding:7px 8px 7px 10px;border-radius:8px;cursor:pointer;color:var(--ink);background:rgba(56,168,255,.13);border-left:3px solid #38a8ff}
.dmit:hover,.dmit.on{background:rgba(56,168,255,.24)}
.dmit .lt{flex:1;font-size:17px;font-weight:700;letter-spacing:2px;color:#0a5fa8}.dmit .pg{font-size:11px;color:var(--ink-3)}
[data-theme="dark"] .dmit .lt{color:#8fd3ff}
.dmx{margin:2px 0 8px 22px;border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:8px;background:var(--panel);color:var(--ink)}
.dmx .cue{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.dmx .cue .lab{font-size:12px;color:var(--ink-3)}
.dmxr{display:grid;gap:4px}.dmxr .h{display:flex;align-items:center;gap:6px}.dmxr .idx{width:16px;color:var(--ink-3);font-size:12px}.dmxr .sp{flex:1}.dmxr .note{font-size:11px;color:var(--ink-3)}
.dmx .acts{display:flex;gap:6px;flex-wrap:wrap}.dmx .hint{margin:0;font-size:11px;color:var(--ink-3)}
.wchap{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}.wchap label{display:flex;gap:4px;align-items:center}
/* 안 쓰는 기능 숨김 (저장된 기록은 그대로) */
#rangeLbl,#status,[data-mode="review"],#kwBtn,#pmBtn,#spreadBtn,#fitBtn,#finalBtn,#legend,[data-act="stats"],[data-act="help"]{display:none!important}
.seg:has(> #spreadBtn){display:none!important}
.qsp{position:absolute;width:3px;background:#7b4fd6;opacity:.55;border-radius:2px;pointer-events:none}
.qsl{position:absolute;transform:translate(-50%,0);font-size:10px;font-weight:700;line-height:1;padding:3px 4px;border-radius:4px;background:#7b4fd6;color:#fff;cursor:pointer;z-index:3;white-space:nowrap}
.qimg{width:100%;background-repeat:no-repeat;border:1px solid var(--line);border-radius:6px;background-color:#fff}
.qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qrow .num{font-weight:700;min-width:3.2em}
.qbadge{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.qbadge.o{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}.qbadge.s{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}.qbadge.x{border-color:var(--ng);color:var(--ng);background:var(--ng-soft)}
.qj button{min-width:3.4em;font-size:15px}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-ui);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* top bar */
#top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));position:relative;z-index:20}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:12px}
.status{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);white-space:nowrap}
.status.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.seg{display:flex;background:var(--well);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.tb{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:7px;font-size:13px;white-space:nowrap}
.tb:hover{border-color:var(--ink-3)}
.tb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;display:grid;gap:2px;z-index:40}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--well)}
/* sub bar */
#sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2);padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
#sub:empty{display:none}
body.menuoff #top,body.menuoff #sub{display:none}
body.eye-paper{--paper:#e9e3d6}
body.eye-paper .page{filter:sepia(.28) saturate(.82) brightness(.97) contrast(.9);box-shadow:0 1px 3px rgba(80,60,30,.18)}
body.eye-night{--paper:#1b1a18}
body.eye-night #viewer{background:#1b1a18}
body.eye-night .page{filter:invert(.9) hue-rotate(180deg) sepia(.18) brightness(1.02) contrast(.92);box-shadow:none}
body.eye-night .mmbtn,body.eye-night .memo{filter:invert(1) hue-rotate(180deg)}
.page{transition:filter .25s}
#menuOpen{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(150px + env(safe-area-inset-right,0px));z-index:30;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:9px 14px;font-size:13px;box-shadow:var(--shadow)}
#menuOpen:hover{opacity:1}
#menuClose{border:0;background:var(--well);color:var(--ink-2);border-radius:7px;padding:5px 9px;font-size:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.sw{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-3px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
/* main */
#main{display:grid;grid-template-columns:300px 1fr;min-height:0}
#main.noside{grid-template-columns:1fr}
#main.noside #side{display:none}
body.noside #back{left:calc(16px + env(safe-area-inset-left,0px))}
#side{background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr;min-height:0}
#tabs{display:flex;gap:2px;margin:0 12px 8px;background:var(--well);border-radius:8px;padding:2px}
#tabs button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px 0;font-size:13px;color:var(--ink-2)}
#tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cm{pointer-events:none;border-radius:2px}
.cm-issue{box-shadow:inset 0 -2.5px 0 #f08c00}
.cm-fact{background:linear-gradient(to top,transparent 0,transparent 0) ,none;border-bottom:2.5px dotted #5c6470}
.cm-hold{box-shadow:inset 0 -2.5px 0 #c92a2a}
.cm-alt{box-shadow:inset 0 -1.5px 0 #9aa1ab}
.cm-rule{box-shadow:inset 0 -2px 0 #364fc7}
.cm-exc{box-shadow:inset 0 -2px 0 #0b7285}
.cmtag.rule{background:#364fc7}.cmtag.exc{background:#0b7285}
.pmo{pointer-events:none;border-radius:3px}.pmo.yes{box-shadow:inset 0 -2px 0 #2b8a3e}.pmo.no{box-shadow:inset 0 -2px 0 #c92a2a}
.pmb{position:absolute;transform:translate(0,-50%);width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:800;line-height:16px;box-shadow:0 0 0 1.5px #fff;text-align:center;color:#fff;pointer-events:none;z-index:3}
.pmb.yes{background:#2b8a3e}.pmb.no{background:#c92a2a}
.cmtag.pos{background:#c92a2a;color:#fff;font-size:9px;padding:2px 4px}
.cmtag{position:absolute;transform:translate(-100%,-50%);font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;color:#fff;white-space:nowrap;pointer-events:none;z-index:3}
.cmtag.issue{background:#f08c00}.cmtag.fact{background:#5c6470}.cmtag.hold{background:#c92a2a}
.csi{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin:0 4px 6px;display:grid;gap:4px;background:var(--panel)}
.csi .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.csi .top b{color:var(--cs-ink);font-size:12px}
.csi .top .sp{flex:1}
.csi .star{border:0;background:none;font-size:15px;line-height:1;color:var(--ink-3);padding:0 2px}
.csi .star[aria-pressed="true"]{color:#e0a100}
.csi .iss{font-size:13px;font-weight:600;cursor:pointer;line-height:1.35}
.csi .hold{font-size:12.5px;line-height:1.35;border-radius:5px;padding:4px 7px;background:var(--cs-soft);color:var(--ink)}
.csi .hold.hid{background:var(--kw-cover);color:var(--kw-num);cursor:pointer;text-align:center;font-size:12px}
.csi .ng{color:var(--ng)}
.csq .lab{font-size:12px;font-weight:700;color:var(--cs-ink)}
.law{margin:8px 4px 4px;font-size:12px;font-weight:700;color:var(--st-ink);display:flex;align-items:center;gap:6px}
.law span{font-weight:400;color:var(--ink-3)}
.art{display:flex;align-items:baseline;gap:6px;padding:3px 6px;border-radius:6px;flex-wrap:wrap}
.art:hover{background:var(--well)}
.art b{min-width:58px;font-variant-numeric:tabular-nums;font-size:13px;cursor:pointer}
.art .dt{font-size:11px;color:var(--ink-3);flex-basis:100%;padding-left:64px;margin-top:-2px}
.pchip{border:1px solid var(--st-line);background:var(--panel);color:var(--st-ink);border-radius:99px;padding:0 7px;font-size:11px;font-variant-numeric:tabular-nums;line-height:18px}
.pchip:hover{background:var(--st-soft)}
.st{cursor:pointer;background:rgba(123,79,214,.10);box-shadow:inset 0 -2px 0 rgba(123,79,214,.75);border-radius:1px;mix-blend-mode:multiply}
.st:hover{background:rgba(123,79,214,.2)}
.rv.k-pm{border-color:#c92a2a;background:rgba(201,42,42,.08)}
.rv.k-cm{border-color:#f08c00;background:rgba(240,140,0,.08)}
.rv.k-st{border-color:#7b4fd6;background:rgba(123,79,214,.12)}
#side .head{padding:10px 12px 6px;display:grid;gap:8px}
#q{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font:inherit;color:var(--ink)}
#legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-2);padding:0 2px}
#legend span{display:inline-flex;align-items:center;gap:4px}
#legend i{width:22px;height:12px;border-radius:2px;display:inline-block}
#cur{margin:0 12px 8px;padding:8px 10px;border-radius:8px;background:var(--well);font-size:12px;color:var(--ink-2);display:grid;gap:4px}
#cur .t{color:var(--ink);font-weight:600;font-size:13px}
#cur .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#cur .r button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px}
#tree{overflow:auto;padding:4px 6px 40px;min-height:0;font-size:13px}
.pjump{position:sticky;top:-4px;z-index:2;display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:-4px -6px 2px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.pjump .pl{font-size:11px;color:var(--ink-3);margin-right:2px}
.pjump button{min-width:26px;height:24px;padding:0 6px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:6px;font-size:12px;line-height:1}
.pjump button.on{background:var(--accent-soft);font-weight:700}
.node{display:flex;align-items:flex-start;gap:4px;padding:3px 6px;border-radius:6px;cursor:pointer;line-height:1.4}
.node:hover{background:var(--well)}
.node.on{background:var(--accent-soft)}
.node .tw{width:16px;flex:none;color:var(--ink-3);font-size:10px;padding-top:3px;text-align:center;border:0;background:none}
.node .tt{flex:1;min-width:0}
.node.ans{box-shadow:inset 2px 0 0 #b0956b;border-radius:0 6px 6px 0}.node.ans .tt{color:var(--ink-2)}
.node .anst{display:inline-block;font-size:10px;line-height:1.5;padding:0 5px;margin-right:5px;border:1px solid #b0956b;color:#b0956b;border-radius:4px;vertical-align:1px}
.node .pg{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;padding-top:1px}
.node .rd{font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:99px;padding:0 5px;margin-top:2px}
.node[data-lv="0"] .tt,.node[data-lv="1"] .tt{font-weight:600}
.node[data-lv="2"] .tt{font-weight:600;color:var(--ink)}
.node .mk{width:6px;height:14px;border-radius:2px;flex:none;margin-top:3px}
.hidden-t{background:var(--well);color:transparent;border-radius:4px;user-select:none}
.kids{margin-left:12px;border-left:1px dashed var(--line);padding-left:2px}
.res{display:grid;gap:8px;padding:6px}
.res .item{border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:grid;gap:4px;background:var(--panel)}
.res .item:hover{border-color:var(--ink-3)}
.res .meta{font-size:11px;color:var(--ink-3)}
/* viewer */
#viewer{overflow:auto;min-height:0;position:relative;padding-block:18px 90px;-webkit-overflow-scrolling:touch}

<script>
'use strict';
const ROUND='r01'; /* 기록 저장 위치 이름(바꾸지 않음) */
const ROUNDS=window.INSA_ROUNDS||['r01']; /* 회차를 추가하면 여기에 'r02' 식으로 덧붙인다 */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='style')e.style.cssText=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(n,v===true?'':v)}for(const c of k.flat()){if(c!=null)e.append(c.nodeType?c:document.createTextNode(c))}return e};
const pct=v=>(v*100).toFixed(3)+'%';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const md=s=>s?s.slice(5).replace('-','/'):'';
let toastT; function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
const ro=w=>{const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'(으)로';const j=(c-0xAC00)%28;return w+(j===0||j===8?'로':'으로')};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- storage: claude db (기기 간 동기) → 안 되면 이 브라우저 ---------- */
const Store={db:null,me:null,mode:'local',q:{},busy:{},
  async init(){
    try{const c=window.claude;if(c&&c.use){const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
      if(db&&user){const id=await user.id();if(id){this.db=db;this.me=id;this.mode='db'}}}}catch(e){}
  },
  ref(key){const base='data/users/'+this.me+'/'+ROUND;if(key.startsWith('bk_'))return this.db.doc(base).collection('backup').doc(key.slice(3));return key==='main'?this.db.doc(base):this.db.doc(base).collection('notes').doc(key)},
  async listBackups(){if(this.mode!=='db')return [];try{const s=await this.db.doc('data/users/'+this.me+'/'+ROUND).collection('backup').get();return s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}))}catch(e){return null}},
  async get(key){
    if(this.mode==='db'){for(let t=0;t<4;t++){try{const s=await this.ref(key).get();const v=s.exists?JSON.parse(JSON.stringify(s.data())):null;const P=await this.pendNewer(key);if(P){this.put(key,P);return P}return v}catch(e){await new Promise(r=>setTimeout(r,600*(t+1)))}}return undefined}
    try{const v=localStorage.getItem('insa:'+ROUND+':'+key);return v?JSON.parse(v):null}catch(e){return null}
  },
  pendKey(key){return 'insa:pend:'+ROUND+':'+key},
  put(key,val){this.q[key]=val;if(this.mode==='db'&&!key.startsWith('bk_')){try{localStorage.setItem(this.pendKey(key),JSON.stringify({t:Date.now(),v:val}))}catch(e){}}clearTimeout(this.q['_t'+key]);this.q['_t'+key]=setTimeout(()=>this.flush(key),700)},
  async flush(key){
    if(this.busy[key]){this.q['_t'+key]=setTimeout(()=>this.flush(key),400);return}
    if(!(key in this.q))return; const val=this.q[key]; delete this.q[key];
    if(this.mode==='db'){this.busy[key]=true;try{await this.ref(key).set(val);if(!(key in this.q)){try{localStorage.removeItem(this.pendKey(key))}catch(e){}}}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await this.ref(key).set(val)}catch(e2){saveFail(e2)}}else saveFail(e)}
      finally{this.busy[key]=false}}
    else{try{localStorage.setItem('insa:'+ROUND+':'+key,JSON.stringify(val))}catch(e){saveFail(e)}}
  },
  async pendNewer(key){// 앱이 갑자기 닫혀 기기 저장소에 못 쓴 마지막 변경
    try{const raw=localStorage.getItem(this.pendKey(key));if(!raw)return null;const P=JSON.parse(raw);const rec=window.INSA&&await window.INSA.Local.get(this.ref(key).path);
      if(!rec||P.t>rec.t)return P.v;localStorage.removeItem(this.pendKey(key));return null}catch(e){return null}},
  async listNotes(){
    if(this.mode==='db'){try{const s=await this.db.doc('data/users/'+this.me+'/'+ROUND).collection('notes').get();const o={};s.docs.forEach(d=>o[d.id]=d.data());
      const pre='insa:pend:'+ROUND+':';const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre)&&/^p\d+$/.test(k.slice(pre.length)))ks.push(k.slice(pre.length))}
      for(const k of ks){const P=await this.pendNewer(k);if(P){o[k]=P;this.put(k,P)}}
      return JSON.parse(JSON.stringify(o))}catch(e){return {}}}
    const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const m=k.match(/^insa:r01:(p\d+)$/);if(m)o[m[1]]=JSON.parse(localStorage.getItem(k))}}catch(e){}return o
  }
};
function saveFail(e){toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 펜 필기나 메모를 일부 지운 뒤 다시 해 보세요.':'저장하지 못했습니다. 인터넷 연결을 확인해 주세요.',4000)}

/* ---------- state ---------- */
let D=null;                       // 회차 기본 데이터
let U={ov:{blanks:{},heads:{},links:{},dumunja:{},stats:{},proseMarks:{},caseMarks:{}},add:{blanks:[],heads:[],links:[],dumunja:[],stats:[],proseMarks:[],caseMarks:[]},res:{},dres:{},qres:{},reads:{},mineDel:[],confirmed:null,pageImg:{},band:true,kw:true,st:true,cres:{},cstar:{},zoom:1,spread:true,fit:false,side:true};
const NOTES={};                   // 'p12' -> {memos:[],strokes:[]}
const ON=new Set();function has(x){return x==='review'?mode==='review':(mode!=='review'&&ON.has(x))}
let mode='read', opened=new Set(), recallShown=new Set(), sel=null, tool=null, pen={c:'#4b4f56',w:2.2,a:1,er:false}, sawPen=false;
const KIND={blanks:'빈칸',heads:'목차 띠',links:'링크',dumunja:'두문자',stats:'조문',proseMarks:'공헌·비판',caseMarks:'판례 표시'};
const PMK={hold:'결론·입장',alt:'반대 견해',rule:'공헌·장점',exc:'비판·한계',yes:'긍정 ○',no:'부정 ✕'},CMK={issue:'쟁점',fact:'사실',hold:'결론'};
function stripP(d){return d}
function mineSnap(){return {dms:(U.add.dumunja||[]).filter(d=>d.mine),blanks:(U.add.blanks||[]).filter(b=>b.mine||b.core),del:U.mineDel||[],ovDel:Object.keys(U.ov.blanks||{}).filter(id=>U.ov.blanks[id]&&U.ov.blanks[id].del),ovDm:JSON.parse(JSON.stringify(U.ov.dumunja||{})),t:Date.now()}}
function saveU(){if(Store.blocked)return;Store.put('main',U);
  const snap=mineSnap();if(!snap.blanks.length&&!snap.dms.length&&!snap.del.length&&!snap.ovDel.length&&!Object.keys(snap.ovDm).length)return;
  const d=new Date(),day=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  Store.put('bk_latest',snap);Store.put('bk_'+day,snap);
  try{localStorage.setItem('insa:mineMirror',JSON.stringify(snap))}catch(e){}}
function mergeMine(snap){if(!snap||!snap.blanks)return 0;U.mineDel=Array.from(new Set([...(U.mineDel||[]),...(snap.del||[])]));
  const have=new Set((U.add.blanks||[]).map(b=>b.id));let n=0;
  for(const b of snap.blanks){if(!have.has(b.id)&&!U.mineDel.includes(b.id)){U.add.blanks.push(b);have.add(b.id);n++}}
  {const hv=new Set((U.add.dumunja||[]).map(d=>d.id));for(const d of snap.dms||[]){if(!hv.has(d.id)&&!U.mineDel.includes(d.id)){U.add.dumunja.push(d);n++}}}
  for(const id of Object.keys(snap.ovDm||{})){if(!U.ov.dumunja[id]&&Object.keys(snap.ovDm[id]||{}).length){U.ov.dumunja[id]=snap.ovDm[id];n++}}
  for(const id of snap.ovDel||[]){if(!(U.ov.blanks[id]&&U.ov.blanks[id].del)){U.ov.blanks[id]={...(U.ov.blanks[id]||{}),del:true};n++}}return n}
async function restoreMine(){let n=0;
  const lat=await Store.get('bk_latest');if(lat)n+=mergeMine(lat);
  try{const m=localStorage.getItem('insa:mineMirror');if(m)n+=mergeMine(JSON.parse(m))}catch(e){}
  if(n){saveU();renderAll();updateSub();toast('직접 고친 빈칸 기록 '+n+'건을 백업에서 되살렸습니다',5000)}}
async function openMineBackup(){const body=el('div',{class:'sb'});sheet('내 빈칸 백업',body);
  body.append(el('p',{},'내 빈칸은 저장할 때마다 날짜별로 따로 백업됩니다. 되살리기를 누르면 그 백업에 있고 지금 없는 빈칸만 다시 넣습니다(직접 지운 것은 빼고). 지금 있는 빈칸은 지워지지 않습니다.'));
  const L=await Store.listBackups();if(!L){body.append(el('div',{class:'empty'},'백업 목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'));return}
  const cur=items('blanks').filter(b=>b.mine).length;body.append(el('div',{},'지금 내 빈칸: '+cur+'개'));
  L.sort((a,b)=>(b.t||0)-(a.t||0)).forEach(bk=>{const nb=(bk.blanks||[]).length;
    body.append(el('div',{class:'qc'},el('div',{class:'qrow'},el('b',{},bk.id==='latest'?'가장 최근':bk.id.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3')),el('span',{},'내 빈칸 '+nb+'개'),el('span',{style:'flex:1'}),
      el('button',{class:'tb',onclick:()=>{const n=mergeMine(bk);if(n){saveU();renderAll();updateSub()}toast(n?n+'개를 되살렸습니다':'빠진 빈칸이 없습니다');}},'되살리기'))))})}
function items(k){const ov=U.ov[k]||{};const out=[];for(const b of (D[k]||[])){const o=ov[b.id];if(o&&o.del)continue;out.push(o?{...b,...o}:b)}for(const a of(U.add[k]||[])){if(a.rk!=null){const r=(D.rounds||[]).find(r=>r.key===a.rk);if(!r||a.lp>=r.n)continue;const o={...a,p:r.start+a.lp};if(Array.isArray(a.t))o.t=a.t.map(t=>({...t,p:r.start+(t.lp!=null?t.lp:a.lp)}));out.push(o)}else out.push(a)}return out}
/* 메모·펜 필기·이미지 교체 기록의 저장 번호. 편을 넣은 순서나 화면 순서와 상관없이 같은 값이 나온다.
   1편(r01)은 예전 그대로 0~49, 다른 편은 편번호*10000+편 안 쪽번호(2편 8번째 쪽 = 20007). 이 규칙은 바꾸지 않는다. */
const LEG='r01';
function sk(i){const r=roundOf(i);if(!r)return i;const lp=i-r.start;return r.key===LEG?lp:parseInt(r.key.slice(1),10)*10000+lp}
function roundOf(p){return (D.rounds||[]).find(r=>p>=r.start&&p<r.start+r.n)}
function fixAdds(){let ch=false;for(const list of Object.values(U.add||{}))for(const a of list||[]){if(a.rk==null&&typeof a.p==='number'){const r=roundOf(a.p);if(r){a.rk=r.key;a.lp=a.p-r.start;ch=true}}}if(ch)saveU()}
function patch(k,id,obj){const isAdd=(U.add[k]||[]).find(a=>a.id===id);if(isAdd)Object.assign(isAdd,obj);else U.ov[k][id]={...(U.ov[k][id]||{}),...obj};saveU()}
function remove(k,id){if((k==='blanks'&&/^[mc]-/.test(String(id)))||(k==='dumunja'&&/^d-/.test(String(id)))){U.mineDel=U.mineDel||[];if(!U.mineDel.includes(id))U.mineDel.push(id)}const i=(U.add[k]||[]).findIndex(a=>a.id===id);if(i>=0)U.add[k].splice(i,1);else U.ov[k][id]={...(U.ov[k][id]||{}),del:true};saveU()}
function heads(){return items('heads').slice().sort((a,b)=>a.p-b.p||a.y-b.y)}
function pageSrc(i){const id=U.pageImg[sk(i)];return id?('_blob/'+id):D.pages[i].src}
function pageLabel(i){const l=D.pages[i].label;return /^\d/.test(l)?l+'쪽':l}
function sectionAt(p,y){let cur=null;for(const h of heads()){if(h.p<p||(h.p===p&&h.y<=y+0.005))cur=h;else break}return cur}

/* ---------- pages ---------- */
const PG=[]; let baseW=860;
function pageWidth(){return Math.round(baseW*U.zoom)}
function buildPages(){
  const wrap=$('#pages');wrap.textContent='';PG.length=0;let sp=null;
  D.pages.forEach(pg=>{
    const img=el('img',{alt:pageLabel(pg.i)+' 원본',loading:pg.i<3?'eager':'lazy',decoding:'async',src:pageSrc(pg.i)});
    img.addEventListener('error',()=>{if(U.pageImg[sk(pg.i)]){img.src=pg.src}});
    const ov=el('div',{class:'ov'});
    const box=el('div',{class:'page',id:'pg'+pg.i,'data-i':pg.i},el('span',{class:'lbl'},pageLabel(pg.i)),img,ov);
    if(!twoUp()||pg.i===0||pg.i%2===1){sp=el('div',{class:'spread'});wrap.append(sp)}
    sp.append(box);PG[pg.i]={box,ov,img,canvas:null};
  });
  sizePages();renderAll();
  const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting)ensureCanvas(+e.target.dataset.i)},{root:$('#viewer'),rootMargin:'600px 0px'});
  PG.forEach(p=>io.observe(p.box));
}
function sizePages(){const w=pageWidth();D.pages.forEach(pg=>{const b=PG[pg.i].box;b.style.width=w+'px';b.style.aspectRatio=pg.w+' / '+pg.h});$('#zLbl').textContent=Math.round(U.zoom*100)+'%';PG.forEach((p,i)=>{if(p.canvas)drawStrokes(i)})}
function twoUp(){return window.innerWidth>820}
function fitBase(){const v=$('#viewer');const avail=v.clientWidth-34;const ar=D?D.pages[10].w/D.pages[10].h:.7;
  let w=twoUp()?(avail-6)/2:Math.min(avail,twoUp()?avail:1100);

  baseW=Math.max(240,Math.floor(w))}

function boxEl(r,cls,attrs={}){return el('div',{class:'box '+cls,style:`left:${pct(r[0])};top:${pct(r[1])};width:${pct(r[2])};height:${pct(r[3])}`,...attrs})}
const BANDC=['var(--band1)','var(--band2)','var(--band3)','var(--band4)'];
let BLN={};
function numberBlanks(){BLN={};const hs=heads();const cnt={};
  const bs=items('blanks').slice().sort((a,b)=>{if(a.p!==b.p)return a.p-b.p;const ay=a.r[0][1]+a.r[0][3]/2,by=b.r[0][1]+b.r[0][3]/2;if(Math.abs(ay-by)>.007)return ay-by;return a.r[0][0]-b.r[0][0]});
  for(const b of bs){const y=b.r[0][1];let sec=null;for(const h of hs){if(h.lv>3||!h.w)continue;if(h.p<b.p||(h.p===b.p&&h.y<=y+.005))sec=h;else break}
    const k=sec?sec.id:'_';cnt[k]=(cnt[k]||0)+1;BLN[b.id]=cnt[k]}}
function renderAll(){numberBlanks();for(let i=0;i<D.pages.length;i++)renderPage(i);renderInsp();placeMM()}
function renderPage(i){
  const P=PG[i];if(!P)return;const ov=P.ov;
  [...ov.children].forEach(c=>{if(c.tagName!=='CANVAS')c.remove()});
  ov.className='ov'+(has('pen')||MKB?' pen':'')+(MKB==='dm'?' dmmode':'')+((mode==='review'&&tool&&tool.draw)||has('memo')?' drawmode':'');
  const R=mode==='review';
  // 목차 띠
  for(const h of heads()){if(h.p!==i||!h.w)continue;
    const hb=[h.x-.0015,h.y-.001,h.w+.003,h.h+.002];
    
    if(R){ov.append(rvBox('heads',h,hb,0,(h.lv>=3?'띠 '+(h.lv-2):'띠 없음')+' · '+h.t.slice(0,14)));continue}
    if(has('recall')&&h.lv>=4&&!trivialHead(h)&&!recallShown.has(h.id)){const bc=BANDC[Math.min(3,h.lv-3)];ov.append(boxEl(hb,'hc',{style:`left:${pct(hb[0])};top:${pct(hb[1])};width:${pct(Math.max(hb[2],.12))};height:${pct(hb[3])};box-shadow:inset 0 -4px 0 ${bc},inset 0 0 0 1.5px #4fb06c`,title:'눌러서 확인',onclick:()=>{recallShown.add(h.id);for(const b of blanksInHead(h))opened.add(b.id);renderPage(i);renderTree();updateSub()}}));continue}

/* ---------- tree ---------- */
/* 예시문제 답안 표시: OCR 줄 「예시문제」 바로 뒤에 Ⅰ / 1. / ① 로 시작하는 목차가 오면 그 답안의 목차로 본다.
   끝: 장(lv≤2), 다음 「예시문제」, 같은 단(lv3)에서 번호 모양이 바뀜(Ⅰ 답안 뒤 본문 「6.」 등), 1. 답안이면 본문 번호가 이어지는 곳.
   기록에는 아무것도 저장하지 않는다(화면 표시만). */
function markAns(){
  const T=t=>/^(Ⅰ|Ⅱ|Ⅲ|Ⅳ|Ⅴ|Ⅵ|Ⅶ|Ⅷ|Ⅸ|Ⅹ|[IVX]+\s*\.)/.test(t)?'R':/^\d+\s*\./.test(t)?'N':/^[①-⑳]/.test(t)?'C':'?';
  const num=t=>{const m=String(t).match(/^(\d+)\s*\./);return m?+m[1]:null};
  const hs=(D.heads||[]).slice().sort((a,b)=>a.p-b.p||a.y-b.y);hs.forEach(h=>{delete h.ans});
  const mk=(D.search||[]).filter(q=>/^예시문제/.test(String(q[5]))&&String(q[5]).length<=8).map(q=>({p:q[0],y:q[2]})).sort((a,b)=>a.p-b.p||a.y-b.y);
  const after=(h,m)=>h.p>m.p||(h.p===m.p&&h.y>m.y);
  mk.forEach((m,mi)=>{const nx=mk[mi+1];let k=hs.findIndex(h=>after(h,m));if(k<0)return;const h0=hs[k];
    if(h0.lv<3||h0.p>m.p+1)return;const ty=T(h0.t);if(ty==='?')return;
    let bodyN=null;for(let j=k-1;j>=0;j--){if(hs[j].lv<3)break;if(hs[j].lv===3&&!hs[j].ans){bodyN=num(hs[j].t);break}}
    let expN=ty==='N'?num(h0.t):null;
    for(let j=k;j<hs.length;j++){const h=hs[j];if(nx&&after(h,nx))break;if(h.lv<3)break;
      if(j>k&&h.lv===h0.lv){if(T(h.t)!==ty)break;if(ty==='N'){const n=num(h.t);if(bodyN!=null&&n===bodyN+1&&n!==expN+1)break;expN=n}}
      h.ans=j===k?2:1}});

function buildTree(){
  const hs=heads();const root={kids:[],lv:-1};const st=[root];const L=h=>h.ans?100+h.lv:h.lv;   /* 답안 목차는 앞의 본문 제목 아래로 들어간다 */
  for(const h of hs){const n={h,kids:[]};while(st.length>1&&L(st[st.length-1].h)>=L(h))st.pop();st[st.length-1].kids.push(n);st.push(n)}
  return root.kids;
}
let collapsed=new Set();
function renderTree(){
  if($('#q').value.trim())return;
  if(SIDE==='st'){renderStats();return}
  if(SIDE==='sc'){renderScholars();return}
  if(SIDE==='dm'){renderDmTab();return}
  const t=$('#tree');t.textContent='';
  const curH=CUR&&CUR.id;
  const draw=(ns,into)=>{for(const n of ns){const h=n.h;const hasK=n.kids.length>0;const col=collapsed.has(h.id);
    const hide=false;
    const rd=(U.reads[h.id]||[]).length;
    const row=el('div',{class:'node'+(h.id===curH?' on':'')+(h.ans?' ans':''),'data-lv':h.lv,'data-hid':h.id,onclick:e=>{if(hide){recallShown.add(h.id);renderTree();renderPage(h.p);return}jumpTo(h.p,h.y)}},
      el('button',{class:'tw','aria-label':col?'펼치기':'접기',onclick:e=>{e.stopPropagation();if(!hasK)return;col?collapsed.delete(h.id):collapsed.add(h.id);renderTree()}},hasK?(col?'▶':'▼'):''),
      h.lv>=3?el('span',{class:'mk lv'+Math.min(4,h.lv-2)}):el('span',{class:'mk'}),
      el('span',{class:'tt'+(hide?' hidden-t':'')},h.ans===2?el('span',{class:'anst'},'예시답안'):'',hide?h.t.replace(/./g,'＿').slice(0,12):h.t),
      el('span',{class:'pg'},/^\d/.test(D.pages[h.p].label)?D.pages[h.p].label.split(' ')[0]:''));
    into.append(row);
    if(hasK&&!col){const k=el('div',{class:'kids'});into.append(k);draw(n.kids,k)}}};
  /* 편 바로가기: 목차 맨 위 한 줄. 기기에 들어 있는 편만 번호로 보인다 */
  const ps=[],seen=new Set();for(const h of heads()){if(h.lv!==0)continue;const m=String(h.t).match(/^제\s*(\d+)\s*편/);if(!m||seen.has(m[1]))continue;seen.add(m[1]);ps.push({n:m[1],h})}
  if(ps.length>1){let cp=CUR?CUR.p:null;try{const vp=visiblePages();if(vp.length)cp=Math.max(...vp)}catch(e){}let on=null;if(cp!=null)for(const x of ps)if(x.h.p<=cp)on=x.n;
    t.append(el('div',{class:'pjump'},el('span',{class:'pl'},'편'),...ps.map(x=>el('button',{class:x.n===on?'on':'',title:x.h.t,onclick:()=>{NOFOLLOW=Date.now()+1800;collapsed.delete(x.h.id);{const v=$('#viewer');v.scrollTo({top:Math.max(0,PG[x.h.p].box.offsetTop-90),behavior:'auto'})}if(window.innerWidth<=820)$('#side').classList.remove('open');
      setTimeout(()=>{const r=[...document.querySelectorAll('#tree .node')].find(e=>e.dataset.hid===x.h.id);if(r){const T=$('#tree');T.scrollTop+=r.getBoundingClientRect().top-T.getBoundingClientRect().top-34}},600)}},x.n))))}
  draw(buildTree(),t);
}

    const hx=x+w*f0,hw=w*(f1-f0);const cw=Math.min(w+.02,.4);const cx=hx+hw/2;const x0=Math.max(Math.max(0,x-.01),Math.min(cx-cw/2,x+w+.01-cw));

function setStartAt(x,y){const hit=pageAtPoint(x,y);if(!hit)return;const old=REVSTART&&REVSTART.p;REVSTART={p:hit.p,y:Math.max(0,hit.fy-.006),x:0};if(old!=null&&old!==hit.p)renderPage(old);renderPage(hit.p);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}toast('여기부터 차례로 엽니다. 검은 「여기부터」 표시를 누르면 해제됩니다.',3000)}

function wordsOf(i){return (WORDS&&WORDS[i])||[]}
function wordAt(i,pt){let best=null,bd=1e9;for(const w of wordsOf(i)){const dx=pt[0]<w[0]?w[0]-pt[0]:pt[0]>w[0]+w[2]?pt[0]-w[0]-w[2]:0,dy=pt[1]<w[1]?w[1]-pt[1]:pt[1]>w[1]+w[3]?pt[1]-w[1]-w[3]:0;const d=Math.hypot(dx,dy*1.4);if(d<bd){bd=d;best=w}}return bd<.012?best:null}
function lineRects(ws){const L={};for(const w of ws){(L[w[4]]=L[w[4]]||[]).push(w)}return Object.values(L).map(g=>{const x0=Math.min(...g.map(w=>w[0])),y0=Math.min(...g.map(w=>w[1])),x1=Math.max(...g.map(w=>w[0]+w[2])),y1=Math.max(...g.map(w=>w[1]+w[3]));return [+(x0-.002).toFixed(4),+(y0-.0012).toFixed(4),+(x1-x0+.004).toFixed(4),+(y1-y0+.0024).toFixed(4)]}).sort((a,b)=>a[1]-b[1])}
function cIdx(w,x,end){const c=w[5]||[w[0],w[0]+w[2]];const n=c.length-1;if(!end){for(let j=0;j<n;j++)if(x<c[j+1])return j;return n-1}for(let j=n-1;j>=0;j--)if(x>c[j])return j+1;return 1}
function clipW(w,s,e){const c=w[5];if(!c)return w;s=s==null?0:s;e=e==null?c.length-1:e;if(e<=s)e=s+1;return [c[s],w[1],c[e]-c[s],w[3],w[4],c.slice(s,e+1)]}
function rangeWords(i,a,b){const ws=wordsOf(i);const wa=wordAt(i,a),wb=wordAt(i,b);if(!wa||!wb)return [];
  let ia=ws.indexOf(wa),ib=ws.indexOf(wb),pa=a,pb=b;if(ia>ib||(ia===ib&&a[0]>b[0])){[ia,ib]=[ib,ia];[pa,pb]=[pb,pa]}
  const L=ws.slice(ia,ib+1).slice();
  if(L.length===1)return [clipW(L[0],cIdx(L[0],pa[0]),cIdx(L[0],pb[0],true))];
  L[0]=clipW(L[0],cIdx(L[0],pa[0]),null);L[L.length-1]=clipW(L[L.length-1],null,cIdx(L[L.length-1],pb[0],true));return L}
function mkPreview(i,a,b){mkClear(i);for(const r of lineRects(rangeWords(i,a,b)))PG[i].ov.append(boxEl(r,'mksel'))}
function mkClear(i){PG[i].ov.querySelectorAll('.mksel').forEach(e=>e.remove())}

function dmUserAt(i,pt){return items('dumunja').find(d=>dmT(d).some(t=>t.p===i&&pt[0]>=t.r[0]-.004&&pt[0]<=t.r[0]+t.r[2]+.004&&pt[1]>=t.r[1]-.004&&pt[1]<=t.r[1]+t.r[3]+.004))}

let BQ=0;
function qIt(q){return D.quiz?D.quiz.items.find(x=>x.q===q):null}
function qNo(q){const it=qIt(q);return it&&it.no!=null?it.no:q}
function qLbl(q){const it=qIt(q);return (it&&D.rounds.length>1?it.part+' ':'')+qNo(q)+'번'}

function qImg(it,part,k){const x=it[part][k];const r=x.r;const ar=(r[2]*595)/(r[3]*841);const src=it.dir+x.img;

/* 플렉슬에서 한 글자만 톡 찍은 형광펜은 PDF에 길이 0인 선으로 들어 있어 pdf.js가 그리지 않는다. 그 점들을 찾아 직접 그린다. */
async function drawZeroDots(pg,vp,ctx){
  const O=pdfjsLib.OPS;let ol;try{ol=await pg.getOperatorList()}catch(e){return 0}
  const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
  let s={m:[1,0,0,1,0,0],lw:1,rgb:[0,0,0],ca:1,bm:'source-over',lc:0};const st=[];let n=0;
  const F=ol.fnArray,A=ol.argsArray;
  for(let i=0;i<F.length;i++){const f=F[i],a=A[i];
    if(f===O.save)st.push({...s,m:s.m.slice(),rgb:s.rgb.slice()});
    else if(f===O.restore){if(st.length)s=st.pop()}
    else if(f===O.transform)s.m=mul(s.m,Array.from(a));
    else if(f===O.paintFormXObjectBegin){st.push({...s,m:s.m.slice(),rgb:s.rgb.slice()});if(a&&a[0])s.m=mul(s.m,Array.from(a[0]))}
    else if(f===O.paintFormXObjectEnd){if(st.length)s=st.pop()}
    else if(f===O.setLineWidth)s.lw=a[0];
    else if(f===O.setLineCap)s.lc=a[0];
    else if(f===O.setStrokeRGBColor)s.rgb=[a[0],a[1],a[2]];
    else if(f===O.setGState){for(const [k,v] of a[0]){if(k==='LW')s.lw=v;else if(k==='LC')s.lc=v;else if(k==='CA')s.ca=v;else if(k==='BM')s.bm=v}}
    else if(f===O.constructPath&&(F[i+1]===O.stroke||F[i+1]===O.closeStroke)){
      const ops=a[0],c=a[1];
      if(ops.length===2&&ops[0]===O.moveTo&&ops[1]===O.lineTo&&Math.abs(c[0]-c[2])<.01&&Math.abs(c[1]-c[3])<.01&&s.lc>0&&s.lw>0){
        ctx.save();ctx.setTransform(...mul(vp.transform,s.m));ctx.globalAlpha=s.ca;
        ctx.globalCompositeOperation=s.bm||'source-over';if(ctx.globalCompositeOperation!==(s.bm||'source-over'))ctx.globalCompositeOperation='multiply';
        ctx.fillStyle='rgb('+s.rgb.map(v=>Math.round(v)).join(',')+')';const h=s.lw/2;
        if(s.lc===1){ctx.beginPath();ctx.arc(c[0],c[1],h,0,Math.PI*2);ctx.fill()}else ctx.fillRect(c[0]-h,c[1]-h,s.lw,s.lw);
        ctx.restore();n++}}
  }
  return n}
async function replacePages(file,startI,log){
  const say=t=>log.append(el('div',{},t));
  let assets=null;try{assets=await window.claude?.use?.('assets')}catch(e){}
  if(!assets){say('이 화면에서는 이미지를 올릴 수 없습니다. 이 페이지를 만든 계정으로 claude.ai에서 열어 주세요.');return}
  try{if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}}catch(e){say('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}
  let pdf;try{pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise}catch(e){say('PDF를 열지 못했습니다: '+(e.message||e));return}
  const cnt=Math.min(pdf.numPages,D.pages.length-startI);
  say('PDF '+pdf.numPages+'쪽 중 '+cnt+'쪽을 '+pageLabel(startI)+'부터 넣습니다.'+(pdf.numPages!==D.pages.length-startI?' (쪽수가 맞지 않습니다. 남는 쪽은 버립니다)':''));
  for(let k=0;k<cnt;k++){
    const i=startI+k;const pg=await pdf.getPage(k+1);const vp0=pg.getViewport({scale:1});
    const ar=vp0.width/vp0.height,ar0=D.pages[i].w/D.pages[i].h;
    if(Math.abs(ar-ar0)/ar0>.015){say(pageLabel(i)+': 페이지 비율이 기준본과 달라 건너뜁니다 (상자 위치가 어긋남)');continue}
    const vp=pg.getViewport({scale:1344/vp0.width});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    try{await drawZeroDots(pg,vp,c.getContext('2d'))}catch(e){console.warn('dots',e)}
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
    try{const up=await assets.upload(blob,{type:'image/jpeg'});U.pageImg[sk(i)]=up.id;saveU();PG[i].img.src=pageSrc(i);say(pageLabel(i)+' 교체')}
    catch(e){say(pageLabel(i)+': 올리지 못했습니다 ('+(e.code||e.message||e)+')');if(e&&e.code==='quota_exceeded')break}
  }
  say('끝났습니다.');
}

  jumpTo(i,0);$('#goPage').blur()});
/* ---------- 회차 합치기 ---------- */
async function loadRounds(){
  /* 기기에 들어 있는 편만 열고, 넣은 순서와 상관없이 교재 쪽 번호 순서로 늘어놓는다. 기록은 모두 (편, 편 안 쪽번호)로 저장되므로 순서가 바뀌어도 밀리지 않는다. */
  const got=[];
  for(const r of ROUNDS){let j=null;try{const x=await fetch('data/'+r+'.json');if(x.ok)j=await x.json()}catch(e){}
    if(!j||!Array.isArray(j.pages))continue;
    const ns=j.pages.map(pg=>parseInt(pg.label,10)).filter(n=>n>0);got.push({r,j,first:ns.length?Math.min(...ns):1e9})}
  got.sort((a,b)=>a.r===LEG?-1:b.r===LEG?1:a.first-b.first);
  const parts=got.map(g=>g.j),RK=got.map(g=>g.r);
  if(!parts.length)throw new Error('교재가 기기에 없습니다');
  const M={pages:[],heads:[],blanks:[],links:[],dumunja:[],stats:[],caseMarks:[],proseMarks:[],search:[],maps:{},rounds:[]};
  let off=0;
  parts.forEach((R,ri)=>{const rk=RK[ri];const pre=rk===LEG?'':rk+':';const P=x=>x==null||!pre?x:pre+x;
    const part=String(R.range||'').split(' (')[0]||R.title;const Q=q=>(typeof q==='number'&&rk!==LEG)?parseInt(rk.slice(1),10)*1000+q:q; /* 2편부터는 문항 번호가 1편과 겹치지 않게 */
    const QR=(q,qr)=>typeof q!=='number'?q:qr===LEG?q:parseInt(qr.slice(1),10)*1000+q; /* 다른 편 묶음의 쪽지 문항에 거는 빈칸·답 범위(qr:'r03' 등) */
    R.pages.forEach(pg=>M.pages.push({...pg,i:pg.i+off,src:'pages/'+rk+'/p'+String(pg.i).padStart(2,'0')+'.jpg',round:rk}));
    for(const k of ['heads','blanks','links','dumunja','stats','caseMarks','proseMarks'])for(const x of (R[k]||[])){
      const y={...x,id:P(x.id),p:x.p+off};
      if(k==='links'&&y.h)y.h=P(y.h);if(k==='dumunja'&&y.cue)y.cue=P(y.cue);if(typeof y.tp==='number')y.tp+=off;
      if(Array.isArray(y.t))y.t=y.t.map(t=>({...t,p:t.p+off}));if(Array.isArray(y.ans))y.ans=y.ans.map(a=>({...a,p:a.p+off}));
      if(k==='blanks')y.q=x.qr?QR(x.q,x.qr):Q(y.q);
      M[k].push(y)}
    for(const q of (R.search||[]))M.search.push([q[0]+off,...q.slice(1)]);
    for(const [k,v] of Object.entries(R.maps||{}))M.maps[P(k)]=v;
    (R.scholars||[]).forEach(g=>{M.scholars=M.scholars||[];M.scholars.push({...g,part,items:g.items.map(it=>({...it,p:it.p.map(x=>x+off)}))})});
    if(R.quiz){M.quiz=M.quiz||{title:R.quiz.title,items:[]};R.quiz.items.forEach(it=>M.quiz.items.push({...it,q:Q(it.q),no:it.q,part:R.quiz.part||part,qt:R.quiz.title,key:(pre||'')+it.q,dir:'quiz/'+rk+'/'}))}
    (R.qspans||[]).forEach(sp=>{M.qspans=M.qspans||[];M.qspans.push({...sp,q:sp.qr?QR(sp.q,sp.qr):Q(sp.q),p:sp.p+off})});
    M.rounds.push({key:rk,title:R.title,part,range:R.range,exam:R.exam,start:off,n:R.pages.length});
    off+=R.pages.length});
  const f=M.rounds[0],l=M.rounds[M.rounds.length-1];
  M.title=M.rounds.length>1?f.part+'~'+l.part:f.title;if(M.quiz&&M.rounds.length>1)M.quiz.title='쪽지시험';
  M.range=M.rounds.map(r=>r.title+': '+r.range).join(' / ');
  M.exam=M.rounds.map(r=>r.exam).join(' / ');
  return M}

/* v14(2편을 처음 넣은 판)에서는 2편 쪽의 메모·펜 필기·이미지 교체가 전체 쪽 순번(50~79)으로 저장됐다.
   새 저장 번호(20000~20029)로 한 번만 복사한다. 옛 기록은 지우지 않고, 새 자리에 이미 내용이 있으면 덮지 않는다. */
function migrateOrder(loaded){
  if(!loaded||Store.blocked)return;
  const has=v=>v&&(((v.memos||[]).length)||((v.strokes||[]).length));
  for(const k of Object.keys(NOTES)){const m=k.match(/^p(\d+)$/);if(!m)continue;const N=+m[1];if(N<50||N>79)continue;
    const src=NOTES[k],dk='p'+(20000+N-50);if(!has(src)||src.mv||has(NOTES[dk]))continue;
    const cp=JSON.parse(JSON.stringify(src));NOTES[dk]=cp;Store.put(dk,cp);
    src.mv=1;Store.put(k,src)}   /* 옮겼다는 표시만 남긴다(내용은 그대로). 새 자리에서 지운 메모가 다시 살아나지 않게 */
  let ch=false;for(const k of Object.keys(U.pageImg||{})){const N=+k;if(!(N>=50&&N<=79))continue;const dk=20000+N-50;if(U.pageImg[dk]==null){U.pageImg[dk]=U.pageImg[k];ch=true}}
  if(ch)saveU()}

/* ---------- boot ---------- */
function normU(u){const b={ov:{blanks:{},heads:{},links:{},dumunja:{},stats:{},proseMarks:{},caseMarks:{}},add:{blanks:[],heads:[],links:[],dumunja:[],stats:[],proseMarks:[],caseMarks:[]},res:{},dres:{},qres:{},reads:{},confirmed:null,pageImg:{},band:true,kw:true,st:true,cres:{},cstar:{},zoom:1,spread:true,fit:false,side:true};
  u=u||{};for(const k of Object.keys(u))if(u[k]!==undefined)b[k]=u[k];for(const k of['ov','add'])for(const kk of['blanks','heads','links','dumunja','stats','proseMarks','caseMarks'])b[k][kk]=b[k][kk]||(k==='ov'?{}:[]);return b}
function applyU(){applyMenu();applyEye();$('#bandBtn').setAttribute('aria-pressed',String(U.band));$('#kwBtn').setAttribute('aria-pressed',String(U.kw!==false));$('#stBtn').setAttribute('aria-pressed',String(U.st!==false));$('#cmBtn').setAttribute('aria-pressed',String(U.cm!==false));$('#pmBtn').setAttribute('aria-pressed',String(U.pm!==false));$('#qsBtn').setAttribute('aria-pressed',String(U.qs!==false));updateStatus();applyLayout(true);PG.forEach((p,i)=>{p.img.src=pageSrc(i);if(p.canvas)drawStrokes(i)});renderAll();renderTree();renderCur();updateSub()}
(async function boot(){
  try{D=await loadRounds()}catch(e){if(window.INSA){location.replace('index.html#stay');return}throw e}
  try{markAns()}catch(e){console.warn('markAns',e)}
  $('#rangeLbl').textContent=D.rounds.length>1?D.title:D.title+' · '+D.rounds[0].range;
  applyLayout(false);buildPages();applyLayout(false);CUR=heads()[0];renderTree();renderCur();updateSub();
  await Store.init();
  const u=await Store.get('main');if(u)U=normU(u);
  if(u===undefined){Store.blocked=true;toast('저장된 기록을 불러오지 못했습니다. 기록이 덮어써지지 않게 저장을 멈췄습니다. 새로고침해 주세요.',8000)}
  const ns=await Store.listNotes();Object.assign(NOTES,ns);
  try{migrateOrder(!!u)}catch(e){console.error('migrateOrder',e)}
  const safe=(f,name)=>{try{return f()}catch(e){console.error(name,e);toast('화면 일부를 그리다 오류가 났습니다('+name+'). 기록은 그대로 있습니다.',6000)}};
  safe(applyU,'applyU');
  safe(fixAdds,'fixAdds');try{if(!Store.blocked){await restoreMine();if((U.add.blanks||[]).some(b=>b.mine))saveU()}}catch(e){console.error('restore',e)}ON.delete('recall');
  for(const m of ['blank','quiz','pen'])safe(()=>{if(!ON.has(m))setMode(m)},'mode-'+m);
  U.menu=false;U.side=true;safe(applyMenu,'menu');safe(()=>applyLayout(true),'layout');
  if(Store.mode!=='db')toast('기록이 이 브라우저에만 저장됩니다. 더보기 → 백업 내보내기를 자주 해 주세요.',5000);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||Store.mode!=='db'||('main' in Store.q)||Store.busy.main)return;
    const u2=await Store.get('main');if(!u2)return;
    if(JSON.stringify(u2.add)===JSON.stringify(U.add)&&JSON.stringify(u2.res)===JSON.stringify(U.res))return;
    const keep={menu:U.menu,side:U.side,zoom:U.zoom};const oldMine=mineSnap();U=normU(u2);Object.assign(U,keep);Store.blocked=false;fixAdds();if(mergeMine(oldMine))saveU();renderAll();updateSub()});
})();
</script>
